# --- Identite de l'application ---
spring.application.name=taskops-api

# --- Port d'ecoute HTTP ---
server.port=8080

# --- Base de donnees H2 en memoire ---
# "mem:taskops" : la base vit dans la RAM, elle est recreee a chaque demarrage.
# Parfait pour developper et pour la CI : aucun etat residuel entre deux executions.
spring.datasource.url=jdbc:h2:mem:taskops
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Hibernate ---
# create-drop : le schema est genere au demarrage et supprime a l'arret.
# Acceptable en developpement UNIQUEMENT. En production : "validate" + migrations Flyway.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Console H2 (interface web pour inspecter la base) ---
# Accessible sur http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
