# --- Identite de l'application ---
spring.application.name=taskops-api

# --- Port d'ecoute HTTP ---
server.port=${SERVER_PORT:8080}

# --- Base de donnees : entierement pilotee par l'environnement ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:taskops}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

# --- Console H2 : ACTIVE EN DEV UNIQUEMENT ---
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console


